<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NougÆn</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NougÆn">
<style>
  :root{
    --bg: #0e0c0a;
    --accent: #c9a24d;
    --text-dim: #a39a8c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100dvh;
    background: var(--bg);
    color: var(--accent);
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .center {
    text-align: center;
  }
  img {
    width: 84px;
    height: 84px;
    border-radius: 20px;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  p {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0;
  }
  a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="center">
  <img src="/apple-touch-icon.png" alt="NougÆn logo">
  <h1>NougÆn</h1>
<p>ホーム画面から開くと自動でNotionに飛ぶで<br>
  <a href="https://fluorescent-satellite-2eb.notion.site/Noug-n-3cbd6a5e8d53804c88c3e4b9bb98dec8?source=copy_link">今すぐNotionを開く</a></p>
</div>
<script>
  // ホーム画面から起動した時(standalone)だけ自動リダイレクト。
  // Safariで普通に開いてる間はこのページに留まって、
  // 「ホーム画面に追加」がこのページ自体を正しく捕まえられるようにする。
  if (window.navigator.standalone === true) {
    window.location.replace("https://fluorescent-satellite-2eb.notion.site/Noug-n-3cbd6a5e8d53804c88c3e4b9bb98dec8?source=copy_link");
  }
</script>
</body>
</html>
