<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Notion埋め込み</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; overflow: hidden; background: #fff; }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      #reload {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        z-index: 10;
        width: 44px;
        height: 44px;
        min-height: 44px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: #37352f;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        -webkit-tap-highlight-color: transparent;
      }
      #reload:active { background: #efefef; }
      #reload svg { width: 22px; height: 22px; display: block; }
      #reload.spinning svg { animation: spin 0.6s linear; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        body { background: #191919; }
        #reload {
          background: rgba(47, 47, 47, 0.92);
          border-color: rgba(255, 255, 255, 0.16);
          color: #e6e6e6;
        }
        #reload:active { background: #3a3a3a; }
      }
      @media (prefers-reduced-motion: reduce) {
        #reload.spinning svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <iframe id="frame" src="https://nougaen-notion.aokassy.workers.dev/" title="Notion" allowfullscreen></iframe>
    <button id="reload" type="button" aria-label="再読み込み" title="再読み込み">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <polyline points="21 3 21 9 15 9" />
      </svg>
    </button>
    <script>
      (function () {
        var frame = document.getElementById('frame');
        var btn = document.getElementById('reload');
        var url = frame.src;
        btn.addEventListener('click', function () {
          btn.classList.remove('spinning');
          void btn.offsetWidth;
          btn.classList.add('spinning');
          // 埋め込み先を最初から読み直す（中で移動した先ではなくトップに戻る）
          frame.src = 'about:blank';
          setTimeout(function () { frame.src = url; }, 30);
        });
      })();
    </script>
  </body>
</html>
